; PlatformIO 工程配置：手势蓝牙控制器
[env:esp32dev]
platform = espressif32 @ 6.4.0
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 115200

build_flags =
    -D USE_NIMBLE=1

lib_deps =
;   t-vk/ESP32 BLE Keyboard@^0.3.2  ; <--- 换回旧版官方键盘库
;   t-vk/ESP32 BLE Mouse@^0.3.1    ; <--- 旧版鼠标库
  h2zero/NimBLE-Arduino@^2.1.0
  https://github.com/webmonkey/ESP32-NIMBLE-Keyboard.git
  adafruit/Adafruit SSD1306@^2.5.7
  adafruit/Adafruit GFX Library@^1.11.9
  adafruit/Adafruit BusIO@^1.14.1

board_build.partitions = huge_app.csv

; 如需编译时切换 OLED 地址（默认 0x3C），可在此覆盖：
; build_flags =
;   -DOLED_ADDR=0x3D
